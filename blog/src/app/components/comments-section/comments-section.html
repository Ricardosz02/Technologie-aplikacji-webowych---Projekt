<div class="mt-3 border-top pt-2">
  <h6 class="small fw-bold">Komentarze ({{ commentsList.length }}):</h6>

  <div class="mb-2" style="max-height: 200px; overflow-y: auto;">
    @for (c of commentsList; track c._id) {
    <div class="comment-item p-2 mb-2 rounded d-flex justify-content-between align-items-start shadow-sm">
      <div style="flex: 1;">
        <div class="d-flex gap-2 align-items-center mb-1">
          <span class="badge bg-secondary" style="font-size: 0.65rem;">{{ c.author }}</span>
          <small class="text-muted" style="font-size: 0.65rem;">{{ c.date | date:'short' }}</small>
        </div>
        <p class="mb-0 small" style="line-height: 1.2;" [innerHTML]="c.text | linkify"></p>
      </div>
      @if (isCommentOwner(c)) {
      <button (click)="remove(c._id)" class="btn btn-sm text-danger border-0 p-0 ms-2">
        <i class="fa fa-trash"></i>
      </button>
      }
    </div>
    } @empty {
    <div class="text-muted small italic p-2 text-center">Brak komentarzy. Dodaj pierwszy!</div>
    }
  </div>

  <form [formGroup]="commentForm" (ngSubmit)="add()">
    <div class="input-group input-group-sm">
      <input type="text" formControlName="text" class="form-control"
        [class.is-invalid]="commentForm.get('text')?.invalid && commentForm.get('text')?.touched"
        placeholder="Napisz komentarz...">
      <button class="btn btn-primary" type="submit" [disabled]="commentForm.invalid">Dodaj</button>
    </div>
    @if (commentForm.get('text')?.invalid && commentForm.get('text')?.touched) {
    <div class="text-danger mt-1" style="font-size: 0.65rem;">
      Wymagane min. 3 znaki.
    </div>
    }
  </form>
</div>
